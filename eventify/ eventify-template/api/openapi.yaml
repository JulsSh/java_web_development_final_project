openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: 'http://localhost:8080'
    description: Generated server url
tags:
  - name: Auth
    description: Authentication and registration
  - name: Bookings
    description: Booking operations
  - name: User
    description: User notification settings
  - name: Admin
    description: Administrative functions
  - name: Events
    description: Event management
paths:
  /user/notifications:
    get:
      tags:
        - User
      summary: Get notification settings
      operationId: userNotificationsGet
      responses:
        '200':
          description: Notification settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - User
      summary: Update notification settings
      operationId: userNotificationsPut
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notification settings not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - User
      summary: Cancel notifications
      operationId: userNotificationsDelete
      responses:
        '204':
          description: Settings deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/bookings/{id}':
    get:
      tags:
        - Bookings
      summary: Get booking by ID
      operationId: bookingsIdGet
      parameters:
        - name: id
          in: path
          description: Booking identifier
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - userAuth: []
    put:
      tags:
        - Bookings
      summary: Update booking
      operationId: bookingsIdPut
      parameters:
        - name: id
          in: path
          description: Booking identifier
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - userAuth: []
    delete:
      tags:
        - Bookings
      summary: Cancel booking
      operationId: bookingsIdDelete
      parameters:
        - name: id
          in: path
          description: Booking identifier
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Booking cancelled
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - userAuth: []
  '/admin/events/{id}':
    put:
      tags:
        - Admin
      summary: Update event (Admin)
      operationId: eventsIdPut
      parameters:
        - name: id
          in: path
          description: Event identifier
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
    delete:
      tags:
        - Admin
      summary: Delete event (Admin)
      operationId: eventsIdDelete
      parameters:
        - name: id
          in: path
          description: Event identifier
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Event deleted
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  '/admin/bookings/{id}/confirm':
    put:
      tags:
        - Admin
      summary: Confirm booking (Admin)
      operationId: adminBookingsIdConfirm
      parameters:
        - name: id
          in: path
          description: Booking identifier
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Booking confirmed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /user/telegram/link:
    post:
      tags:
        - User
      summary: Initiate Telegram linking
      operationId: userTelegramLinkPost
      responses:
        '200':
          description: Code for /start command in the bot
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /bookings:
    get:
      tags:
        - Bookings
      summary: Get own bookings
      operationId: bookingsGet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - userAuth: []
    post:
      tags:
        - Bookings
      summary: Create booking
      operationId: bookingsPost
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - userAuth: []
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register user
      operationId: authRegisterPost
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '404':
          description: Login or password validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in
      operationId: authLoginPost
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events:
    post:
      tags:
        - Admin
      summary: Create event (Admin)
      operationId: eventsPost
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /events:
    get:
      tags:
        - Events
      summary: Get event list
      operationId: eventsGet
      parameters:
        - name: from
          in: query
          description: Filter from date
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Filter to date
          required: false
          schema:
            type: string
            format: date-time
        - name: pageable
          in: query
          description: Pagination and sorting parameters
          required: true
          schema:
            $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageableEventResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/events/{id}':
    get:
      tags:
        - Events
      summary: Get event by ID
      operationId: eventsIdGet
      parameters:
        - name: id
          in: path
          description: Event identifier
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/bookings:
    get:
      tags:
        - Admin
      summary: Get all bookings (Admin)
      operationId: adminBookingsGet
      parameters:
        - name: eventId
          in: query
          description: Event identifier
          required: false
          schema:
            type: integer
            format: int64
        - name: unconfirmedOnly
          in: query
          description: Unconfirmed only
          required: false
          schema:
            type: boolean
        - name: pageable
          in: query
          description: Pagination and sorting parameters
          required: true
          schema:
            $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: Page of bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageableBookingResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  '/admin/bookings/{id}':
    delete:
      tags:
        - Admin
      summary: Delete booking (Admin)
      operationId: adminBookingsIdDelete
      parameters:
        - name: id
          in: path
          description: Booking identifier
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Booking deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
components:
  schemas:
    NotificationPreferences:
      type: object
      properties:
        notifyNewEvents:
          type: boolean
          description: Receive notifications when new events are added
        notifyUpcoming:
          type: boolean
          description: 'Receive reminders for events booked by the user'
        notifyBeforeHours:
          type: integer
          format: int32
          description: >-
            Number of hours before the event start when the notification
            will be sent
          maximum: 24
          minimum: 1
    ErrorDetail:
      type: object
      description: Details about the error that occurred
      properties:
        field:
          type: string
          description: 'The field that contains the error'
          example: email
        message:
          type: string
          description: Error description
          example: Must be a valid email address
    ErrorResponse:
      type: object
      description: Error message
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_FAILED
        level:
          type: string
          description: Severity level
          enum:
            - ErrorResponse.LevelEnum.INFO(value=info)
            - ErrorResponse.LevelEnum.WARNING(value=warning)
            - ErrorResponse.LevelEnum.ERROR(value=error)
          example: error
        message:
          type: string
          description: Human-readable message
          example: Some fields are filled in incorrectly
        details:
          type: array
          description: Error details (optional)
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required:
        - code
        - level
        - message
    BookingResponse:
      type: object
      description: Booking
      properties:
        id:
          type: integer
          format: int64
          description: Booking identifier
        event:
          $ref: '#/components/schemas/EventResponse'
          description: Event
        customerEmail:
          type: string
          description: User email address
        ticketCount:
          type: integer
          format: int32
          description: Number of tickets
        createdAt:
          type: string
          format: date-time
          description: Booking creation date
        expiryTime:
          type: string
          format: date-time
          description: 'Date by which the booking must be confirmed'
        confirmed:
          type: boolean
          description: Indicates whether the booking is confirmed
        timezone:
          type: string
          description: Timezone
      required:
        - event
        - id
    EventResponse:
      type: object
      description: Event details
      properties:
        id:
          type: integer
          format: int64
          description: Event identifier
        title:
          type: string
          description: Event title
        description:
          type: string
          description: Event description
        dateTime:
          type: string
          format: date-time
          description: Event start date and time
        totalTickets:
          type: integer
          format: int32
          description: Total number of seats at the event
        availableTickets:
          type: integer
          format: int32
          description: 'Number of seats available for booking'
        coverUrl:
          type: string
          description: Event cover URL
          example: 'https://example.com/image.jpg'
    UpdateBookingRequest:
      type: object
      description: Request to update a booking
      properties:
        ticketCount:
          type: integer
          format: int32
          description: Number of tickets
          minimum: 1
    EventUpdateRequest:
      type: object
      description: Request to update event details
      properties:
        title:
          type: string
          description: Event title
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Event description
        dateTime:
          type: string
          format: date-time
          description: Event start date and time
        totalTickets:
          type: integer
          format: int32
          description: Total number of seats at the event
          minimum: 1
        coverUrl:
          type: string
          description: Cover URL
    CreateBookingRequest:
      type: object
      description: Request to create a booking
      properties:
        eventId:
          type: integer
          format: int64
          description: Event identifier
        ticketCount:
          type: integer
          format: int32
          description: Number of tickets
          minimum: 1
      required:
        - eventId
        - ticketCount
    AuthResponse:
      type: object
      description: Authorization response
      properties:
        token:
          type: string
          description: Authorization token
        role:
          type: string
          description: User role
          enum:
            - USER
            - ADMIN
    RegisterRequest:
      type: object
      description: Request to create a new user
      properties:
        email:
          type: string
          description: User email address
        password:
          type: string
          description: Password
          maxLength: 2147483647
          minLength: 8
      required:
        - email
        - password
    LoginRequest:
      type: object
      description: User login request
      properties:
        email:
          type: string
          description: User email address
        password:
          type: string
          description: Password
      required:
        - email
        - password
    EventCreateRequest:
      type: object
      description: Request to create an event
      properties:
        title:
          type: string
          description: Event title
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Event description
        coverUrl:
          type: string
          description: Event cover URL
        dateTime:
          type: string
          format: date-time
          description: Event date and time
        totalTickets:
          type: integer
          format: int32
          description: Total number of seats at the event
          minimum: 1
      required:
        - dateTime
        - title
        - totalTickets
    PageableEventResponse:
      type: object
      description: Page of events
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EventResponse'
        pageable:
          $ref: '#/components/schemas/PageableObject'
        last:
          type: boolean
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        first:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: '#/components/schemas/SortObject'
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageableBookingResponse:
      type: object
      description: Page of bookings
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BookingResponse'
        pageable:
          $ref: '#/components/schemas/PageableObject'
        last:
          type: boolean
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        first:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
