databaseChangeLog:
  - changeSet:
      id: 002-create-events
      author: Jouleea
      comment: create table events in the database
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: cover_url
                  type: VARCHAR(254)
              - column:
                  name: date_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: total_tickets
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: available_tickets
                  type: INTEGER
                  constraints:
                    nullable: false