databaseChangeLog:
  - changeSet:
      id: 003-create-bookings
      author: Jouleea
      comment: create table bookings in the database
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bookings_event
                    references: events(id)
              - column:
                  name: customer_email
                  type: VARCHAR(254)
                  constraints:
                    nullable: false
              - column:
                  name: ticket_count
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expiry_time
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: confirmed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: timezone
                  type: VARCHAR(100)
